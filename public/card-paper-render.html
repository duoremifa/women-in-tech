<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>wo/men Brand Paper Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 2400px;
      height: 1350px;
      background: #f7f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 2400px;
      height: 1350px;
      /* 温润手工纸白，杜绝冷光与大面积艳色，还原网站真实质感 */
      background: #fbf9f5;
      padding: 130px 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: inset 0 0 100px rgba(229, 222, 211, 0.4);
    }

    /* 纸质细腻纤维纹理 */
    .film-grain {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(140, 135, 125, 0.08) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      pointer-events: none;
      opacity: 0.65;
    }

    /* 亚麻纤维与哑光细金发丝边框 */
    .inner-border {
      position: absolute;
      inset: 48px;
      border: 1px solid #e5ded3;
      border-radius: 28px;
      pointer-events: none;
    }

    .inner-border::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(216, 205, 176, 0.45);
      border-radius: 20px;
    }

    /* 头部 */
    .card-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    /* 核心字体颜色：经典品牌紫 #5e4c7a */
    .brand-title {
      font-family: 'Lora', 'Georgia', serif;
      font-size: 80px;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1;
      color: #5e4c7a;
    }

    .brand-slash {
      color: #c5a059;
      font-weight: 300;
      margin: 0 2px;
      opacity: 0.9;
    }

    .brand-zh {
      font-family: 'Lora', 'Noto Serif SC', serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #5e4c7a;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      letter-spacing: 0.14em;
      color: #7d689b;
      text-transform: lowercase;
      margin-top: 4px;
    }

    .tag-capsule {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 12px 30px;
      border-radius: 9999px;
      border: 1px solid #e0d8cb;
      background: rgba(243, 240, 232, 0.7);
      color: #6e558e;
    }

    /* 核心文案区域 */
    .card-body {
      position: relative;
      z-index: 10;
      max-width: 1760px;
      margin: auto 0;
    }

    .headline {
      font-family: 'Noto Serif SC', 'Lora', serif;
      font-size: 76px;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: #26221c;
      margin-bottom: 36px;
    }

    .subline {
      font-family: 'Noto Serif SC', 'Lora', serif;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #5e4c7a;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .subline-dot {
      color: #c5a059;
      font-size: 26px;
    }

    /* 底部基线 */
    .card-footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 42px;
      border-top: 1px solid #ede8df;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Noto Serif SC', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #6e558e;
    }

    .footer-star {
      color: #c5a059;
      font-size: 24px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #5e4c7a;
    }

    .footer-arrow {
      color: #c5a059;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="film-grain"></div>
    <div class="inner-border"></div>

    <div class="card-header">
      <div class="brand-col">
        <div class="brand-row">
          <span class="brand-title">wo<span class="brand-slash">/</span>men</span>
          <span class="brand-zh">"我们"</span>
        </div>
        <span class="brand-sub">women in technical</span>
      </div>
      <div class="tag-capsule">Women in Tech & Craft</div>
    </div>

    <div class="card-body">
      <h1 class="headline">在每一个商业项目的空隙里，<br/>总有一些东西是做给自己的。</h1>
      <div class="subline">
        <span class="subline-dot">✦</span>
        <span>这里是那个地方。</span>
      </div>
    </div>

    <div class="card-footer">
      <div class="footer-left">
        <span class="footer-star">✦</span>
        <span>不问头衔 · 只认手艺与真诚</span>
      </div>
      <div class="footer-right">
        <span>wotech.space</span>
        <span class="footer-arrow">⟶</span>
      </div>
    </div>
  </div>
</body>
</html>
